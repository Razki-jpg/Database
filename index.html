<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fall Real Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #F4F4F0;
      --primary: #FFDE00;
      --secondary: #A3D8FF;
      --text: #000;
      --border: 3px solid #000;
      --shadow: 6px 6px 0px #000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg);
      background-image: linear-gradient(#e5e5e5 1px, transparent 1px), linear-gradient(90deg, #e5e5e5 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      padding-bottom: 80px;
    }
    header {
      background-color: var(--primary);
      border-bottom: var(--border);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    .logo span { font-size: 10px; display: block; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card {
      background: #fff; border: var(--border); border-radius: 12px;
      box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px;
    }
    .card-blue { background: var(--secondary); }
    .btn {
      display: inline-block; background: #fff; border: var(--border); border-radius: 8px;
      padding: 12px 20px; font-weight: bold; text-decoration: none; color: #000;
      box-shadow: 4px 4px 0px #000; cursor: pointer; text-align: center;
      transition: transform 0.1s, box-shadow 0.1s; width: 100%; font-family: inherit;
    }
    .btn:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
    .btn-orange { background: #FF9F43; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
    .product-img { width: 100%; height: 100px; background: #eee; border: var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 15px; font-size: 12px; }
    .badge { background: #fff; border: var(--border); padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fff; border: var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; max-width: 350px; width: 100%; text-align: center; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; padding: 10px; background: #fff; border: var(--border); }
    .status-badge { padding: 8px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; display: inline-block; border: var(--border); font-size: 14px; }
    .status-pending { background: #FFDE00; }
    .status-success { background: #4ade80; color: #fff; }
    .status-failed { background: #ff4d4d; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">FALL REAL<span>STORE & ARCADE</span></div>
  </header>

  <div class="container">
    <div class="card card-blue" style="margin-bottom: 20px;">
      <h2 style="font-size: 24px; margin-bottom: 10px;">BERBAGAI PRODUCT</h2>
      <h3 style="font-size: 16px; color: #d35400; margin-bottom: 10px;">APLIKASI BUG X RAT</h3>
      <p style="line-height: 1.5; font-size: 14px;">Saya Fall menjual berbagai produk aplikasi bug untuk eksploitasi WhatsApp dan mengirim serangan RAT.</p>
    </div>
    
    <h3 style="margin-bottom: 15px;">Katalog Produk</h3>
    <div class="grid" id="product-list">
      <p>Memuat produk...</p>
    </div>
  </div>

  <div id="qris-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 5px;">Pembayaran QRIS</h3>
      <p style="font-size: 11px; color: #666; margin-bottom: 10px; word-break: break-all;" id="qris-order-id">TRX ID: -</p>
      <div id="status-container" class="status-badge status-pending">Menunggu Pembayaran...</div>
      <div id="qrcode"></div>
      <p style="font-weight: bold; font-size: 20px; margin-bottom: 15px;" id="qris-amount">Rp 0</p>
      <button class="btn" onclick="closeModal()" style="background: #ddd; font-size: 14px;">TUTUP</button>
    </div>
  </div>

  <script>
    let checkInterval = null;

    fetch('/api/products')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('product-list');
        if(data.length === 0) {
          container.innerHTML = '<p>Data produk kosong.</p>';
          return;
        }
        container.innerHTML = data.map(p => `
          <div class="card" style="margin-bottom: 0; padding: 15px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <span class="badge">${p.badge}</span>
              <div class="product-img">[ GAMBAR ]</div>
              <h4 style="margin-bottom: 5px; font-size: 15px;">${p.name}</h4>
              <p style="font-weight: bold; margin-bottom: 10px; font-size: 14px;">Rp ${p.price.toLocaleString('id-ID')}</p>
              <p style="font-size: 11px; margin-bottom: 15px; color: #444; line-height: 1.4;">${p.desc}</p>
            </div>
            <button class="btn btn-orange" style="padding: 8px; font-size: 12px;" onclick="buyProduct(${p.id})">🛒 BELI (QRIS)</button>
          </div>
        `).join('');
      });

    function buyProduct(id) {
      document.getElementById('qrcode').innerHTML = 'Memuat QR...';
      document.getElementById('status-container').innerText = 'Menunggu Pembayaran...';
      document.getElementById('status-container').className = 'status-badge status-pending';
      document.getElementById('qris-order-id').innerText = 'TRX ID: -';
      document.getElementById('qris-modal').style.display = 'flex';
      if(checkInterval) clearInterval(checkInterval);

      fetch('/api/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: id })
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          document.getElementById('qris-order-id').innerText = 'TRX ID: ' + data.transactionId;
          document.getElementById('qris-amount').innerText = 'Rp ' + data.amount.toLocaleString('id-ID');
          document.getElementById('qrcode').innerHTML = '';
          new QRCode(document.getElementById("qrcode"), {
            text: data.qrData, width: 200, height: 200,
            colorDark : "#000000", colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });
          startPolling(data.transactionId);
        } else {
          alert('Gagal: ' + (data.error || 'Unknown error'));
          closeModal();
        }
      })
      .catch(err => { alert('Error: ' + err.message); closeModal(); });
    }

    function startPolling(trxId) {
      checkInterval = setInterval(() => {
        fetch('/api/check-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transactionId: trxId })
        })
        .then(res => res.json())
        .then(data => {
          const status = data.data?.status || data.status;
          if(status === 'success') {
            clearInterval(checkInterval);
            const badge = document.getElementById('status-container');
            badge.innerText = '✅ PEMBAYARAN BERHASIL';
            badge.className = 'status-badge status-success';
            document.getElementById('qrcode').innerHTML = '<h1 style="font-size:50px; margin: 20px 0;">🎉</h1>';
          } else if (status === 'expired' || status === 'failed') {
            clearInterval(checkInterval);
            const badge = document.getElementById('status-container');
            badge.innerText = '❌ ' + status.toUpperCase();
            badge.className = 'status-badge status-failed';
          }
        })
        .catch(err => console.log('Polling error:', err));
      }, 3000);
    }

    function closeModal() {
      document.getElementById('qris-modal').style.display = 'none';
      if(checkInterval) clearInterval(checkInterval);
    }
  </script>
</body>
</html>
